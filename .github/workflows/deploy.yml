name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests build and test but never deploy, so a broken build is caught
  # before it can reach the published site.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied Pages
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The data artifacts are gitignored, so CI rebuilds them from source on
      # every run. Geometry has to come first: it writes the admin-1 centroid
      # tables that both the tests and the pipeline read.
      - name: Build geometry
        working-directory: web
        run: npm run geo

      - name: Test the pipeline
        working-directory: pipeline
        run: python -m pytest

      - name: Build data artifacts
        working-directory: pipeline
        run: python -m soulfinder.build

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # `npm run build` typechecks before bundling, so a type error fails here
      # rather than shipping. BASE_PATH is empty on pull requests, which the
      # Vite config normalises to "/" for a plain root-served build.
      - name: Build site
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
